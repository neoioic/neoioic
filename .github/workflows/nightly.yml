name: Build, test and update Nightly

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target.platform }} / ${{ matrix.compiler }} / ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: windows-2022
            platform: mingw
          - runner: ubuntu-24.04
            platform: linux
        compiler: [gcc, clang]
        mode: [debug, release]
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Windows compilers
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-compiler-rt
      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cygpath -m /ucrt64/bin >> "$GITHUB_PATH"
      - name: Install Linux compilers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc g++ clang binutils
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.6'
      - name: Build static binaries and test Debug
        env:
          CI_COMPILER: ${{ matrix.compiler }}
          CI_MODE: ${{ matrix.mode }}
        run: python .github/scripts/build.py
      - name: Retain GCC Release package
        if: matrix.compiler == 'gcc' && matrix.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target.platform }}
          path: build/packages/neoioic-x86_64-*.zip
          if-no-files-found: error

  nightly:
    name: Update existing Nightly
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: packages
          merge-multiple: true
      - name: Move nightly tag and replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/neoioic-x86_64-windows.zip
          test -f packages/neoioic-x86_64-linux.zip
          if gh api repos/$GH_REPO/git/ref/tags/nightly > /dev/null 2>&1; then
            gh api --method PATCH repos/$GH_REPO/git/refs/tags/nightly \
              -f sha="$COMMIT" -F force=true
          else
            gh api --method POST repos/$GH_REPO/git/refs \
              -f ref=refs/tags/nightly -f sha="$COMMIT"
          fi
          printf 'Automated GCC static Release builds.\n\nCommit: %s\nWorkflow: %s/%s/actions/runs/%s\n' \
            "$COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > notes.md
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --title Nightly --notes-file notes.md --prerelease --latest=false
          else
            gh release create nightly --verify-tag --title Nightly --notes-file notes.md --prerelease --latest=false
          fi
          gh release upload nightly packages/neoioic-x86_64-windows.zip \
            packages/neoioic-x86_64-linux.zip --clobber
